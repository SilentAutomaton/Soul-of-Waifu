min_p_tooltip: '<b>Min-P (Intelligenter Cutoff)</b><br><br>

  Der neue Goldstandard für Rollenspiel. Er schneidet dynamisch Unsinnswörter ab, basierend auf der Wahrscheinlichkeit des bestmöglichen Wortes.<br><br>

  Wenn die KI sich sicher ist, entfernt sie gnadenlos Unsinn. Wenn Kreativität gefragt ist, senkt sie die Schwelle, um gute Synonyme zuzulassen.<br><br>

  💡 <i>Ersetzt Top-P. Setze Top-P auf 1.0 und verwende Min-P bei <b>0.05 - 0.10</b> für perfekte Logik bei hoher Temperatur.</i>'
mlock_tooltip: '<b>MLock (Speichersperre)</b><br><br>

  Diese Funktion <b>verhindert, dass das Sprachmodell</b> aus dem RAM deines Systems in die Auslagerungsdatei auf deinem Speicherlaufwerk ausgelagert wird.<br><br>

  Wenn aktiviert, bleibt das Modell vollständig im Speicher geladen, was die <b>schnellstmögliche Antwortzeit</b> ohne Mikroruckler während der Nachrichtengenerierung sicherstellt.<br><br>

  💡 <i>Nur empfohlen, wenn du über reichlich System-RAM verfügst, da dieser Speicher dauerhaft reserviert wird. Auf Systemen mit wenig RAM deaktivieren.</i>'
