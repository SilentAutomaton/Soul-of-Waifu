ambient_sound_tooltip: "<b>🎵 Ambient-Sound-Modul</b><br><br>\nDiese Funktion fügt einen <b>atmosphärischen Sound</b> hinzu, wenn du einen Chat mit einem Charakter betrittst.<br><br>\nNach dem Einschalten kannst du das passende <b>Ambiente</b> auswählen — Hintergrundmusik oder Geräusche, die die richtige Stimmung erzeugen:\nsei es rauschender Wind, das Geräusch von Regentropfen oder das gemütliche Knistern eines Lagerfeuers.<br><br>\n\n<b>Beispiel:</b><br>\nWenn du mit einem Charakter in einer <i>Taverne</i> chattest,\nkannst du ein Ambiente mit <i>dem Geräusch einer fröhlichen Menge und einer heiteren Melodie</i> wählen,\num in die Atmosphäre des Ortes einzutauchen und die emotionale Verbindung zum Charakter zu stärken."
