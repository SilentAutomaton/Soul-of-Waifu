system_prompt_button_tooltip: "Hier kannst du <b>den System-Prompt anpassen</b> für das Sprachmodell — wie sich der Charakter während eurer Gespräche verhalten soll.<br><br>\n\nDu kannst:<br>\n• <b>Den Prompt-Text bearbeiten</b> — Ton anpassen, Sprachmuster oder Eigenheiten hinzufügen.<br>\n• <b>Komponenten neu anordnen</b> — die Priorität von Informationen steuern.<br><br>\n\n<b>Warum ist die Reihenfolge wichtig?</b><br>\nDas Modell merkt sich am besten, was <b>näher am Ende</b> des Prompts steht.<br>\nWenn der Charakter öfter auf Lore verweisen soll — verschiebe das Lorebook ans Ende.<br>\nWenn die Persönlichkeit am wichtigsten ist — platziere die Charakterinfo zuletzt.<br><br>\n\n💡 <i>Nutze diesen Editor, um den Charakter authentischer, konsistenter und lebendiger wirken zu lassen. \nPasse Text und Reihenfolge an, bis sie genau so sprechen, wie sie sollen.</i>"
