about_program: Über Soul of Waifu
about_program_description: '<b>Soul of Waifu</b> ist ein kostenloses Desktop-Programm mit offenem Quellcode, in dem sich KI-Charaktere wirklich erinnern, weiterentwickeln und leben – sowohl im Programm selbst als auch auf deinem Desktop. Erstelle oder importiere einen Charakter einmal und interagiere mit ihm über drei miteinander verbundene Dimensionen:<br><br>• 💬 <b>Interaktiver Text- und Sprachchat:</b> Lebendiger 1-zu-1-Dialog mit animierten Live2D/VRM-Avataren, Live-Sprachstreaming, einem adaptiven Status-HUD, Dateianhängen und Werkzeugnutzung. <br><br>• 🎲 <b>Soul Stage Rollenspiel-Engine:</b> Textbasierte Tabletop-Rollenspiele, geleitet von einem KI-Spielleiter mit Weltzustandsverfolgung, Inventarverwaltung und dynamischen NPCs.<br><br>• 🖥️ <b>Soul Companion: </b> Ein eigenständiger Charakter auf deinem Desktop mit einem neurohormonellen Stimmungsmodell, Bilderkennung, Zwischenablage-Lesen und Werkzeugaufrufen.<br><br>Alle Dimensionen werden durch das Modul <b>Soul Memory</b> vereint – ein kognitives Gedächtnissystem mit emotionaler Entwicklung, einem persönlichen Tagebuch und automatischer Auflösung von Widersprüchen. Läuft zu 100 % lokal und privat auf deinem PC über GGUF (CUDA, Vulkan, HIP, SYCL) ohne Filter oder Abonnements, mit Unterstützung für Cloud-APIs, Discord und einen lokalen Web-Client.'
about_program_title: Über Soul of Waifu
