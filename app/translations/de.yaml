sm_mode_full: Vollständige Synchronisation
sm_mode_full_tooltip: '<b>🌌 Vollständige Synchronisation</b><br><br>

  Vollständige kognitive Verbindung. Jeder Aspekt des Charakters ist aktiv:<br><br>

  • <b>Psychologischer Index:</b> Stimmungsverfolgung in Echtzeit.<br>

  • <b>Lore-Themen:</b> Tiefgehender Weltenbau und Fakten.<br>

  • <b>Tagebuch:</b> Emotionale Reflexionen aus der Ich-Perspektive.<br><br>

  <i>Das ultimative Erlebnis. Erfordert ein leistungsstarkes System oder eine API.</i>'
sm_mode_mind_spark: Mind Spark
sm_mode_mind_spark_tooltip: '<b>⚡ Mind Spark</b><br><br>

  Taktisches Gedächtnis für maximale Leistung.<br><br>

  • Aktualisiert <b>NUR</b> den <b>MEMORY.md</b>-Index.<br><br>

  Stellt sicher, dass der Charakter weiß, wer er ist, wie er sich fühlt und was er gerade will.<br><br>

  <b>Was übersprungen wird:</b> Es werden keine Tagebücher oder Lore-Dateien erstellt.<br><br>

  <i>Am besten für: Langsame Systeme oder schnelles Rollenspiel, bei dem nur die Logik zählt.</i>'
sm_mode_reflection_flow: Reflection Flow
sm_mode_reflection_flow_tooltip: '<b>📓 Reflection Flow</b><br><br>

  Emotionale Protokollierung ohne jeglichen Einfluss auf die Chat-Logik.<br><br>

  • Nur der <b>Tagebuch-Agent</b> ist aktiv.<br><br>

  Der Charakter aktualisiert seinen „internen Zustand" im Index nicht, schreibt aber weiterhin emotionale Einträge in sein Tagebuch.<br><br>

  <b>Was übersprungen wird:</b> Keine Aktualisierungen des psychologischen Index oder der Lore.<br><br>

  <i>Am besten für: Maximale Geschwindigkeit bei gleichzeitiger Aufzeichnung der Gefühle des Charakters.</i>'
sm_mode_soul_link: Soul Link
sm_mode_soul_link_tooltip: '<b>🔗 Soul Link</b><br><br>

  Konzentriert sich auf Persönlichkeit und Emotionen.<br><br>

  • Aktualisiert den <b>MEMORY.md</b>-Index, um Stimmung und Ziele des Charakters konsistent zu halten.<br>

  • Der <b>Tagebuch-Agent</b> hält seine privaten Gefühle für dich fest.<br><br>

  <b>Was übersprungen wird:</b> Das System erstellt oder aktualisiert keine Lore-Themen.<br><br>

  <i>Am besten für: Eine tiefe Bindung aufrechterhalten, ohne die CPU/GPU stark zu belasten.</i>'
