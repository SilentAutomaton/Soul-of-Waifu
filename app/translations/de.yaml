  Bestimmt, wie das System deine Konversation formatiert, bevor sie an die KI gesendet wird. Verschiedene Modelle werden auf bestimmte Formate trainiert.<br><br>

  Wird die falsche Vorlage verwendet, kann die KI halluzinieren oder seltsame Symbole ausgeben (wie <code>&lt;|im_end|&gt;</code>).<br><br>

  💡 <i>''Auto'' liest die Vorlage direkt aus der GGUF-Datei. Wenn sich das Modell seltsam verhält, versuche eine bestimmte Vorlage wie ''ChatML'' oder ''Llama-3'' zu erzwingen.</i>'
