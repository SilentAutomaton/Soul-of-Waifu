hint_arcs_format: Hier steuerst du die Freigabe deiner Handlung. Ein Handlungsbogen im Stadium "locked" existiert für keinen Charakter — niemand wird ihn erwähnen oder darauf anspielen. Setze ihn auf "available", sobald der Spieler den Hinweis gefunden hat, der ihn freischalten soll, oder auf "active", sobald er vollständig im Gange ist. "trigger" ist eine Notiz an den Spielleiter, was die Freischaltung auslösen soll — sie wird den Charakteren nie gezeigt.
hint_lore_format: Eine Karte pro Block, getrennt durch eine Leerzeile. Karten werden nur dann in die Geschichte eingefügt, wenn ihre Auslöser in der Szene auftauchen.
hint_npc_readonly: Von der Engine aktuell erzeugte NPCs (schreibgeschützt)
hint_overlays_format: Der eigene, sich entwickelnde Zustand eines Charakters — seine aktuelle Rolle/Titel und alle persönlichen Fakten, die es wert sind, verfolgt zu werden (Loyalität, ein Geheimnis, ein innerer Konflikt). Dies begleitet den Charakter und erscheint in seinem eigenen Prompt, getrennt von der statischen Charakterkarte.
hint_relationships_format: Wie ein Charakter einen anderen empfindet und wahrnimmt — meist die Sicht eines Gruppenmitglieds oder NPCs auf den SPIELER, aber es kann zwischen beliebigen zwei Akteuren bestehen. Dies wird direkt in den eigenen Prompt dieses Charakters eingefügt, sodass es nie vergessen wird. Die Zuneigung reicht von -100 (feindselig) bis 100 (ergeben). "role" ist, wie das Subjekt den aktuellen Status oder Titel des Ziels sieht — unabhängig von der Zuneigung.
