dry_base_text: DRY-Basis
dry_base_tooltip: '<b>DRY-Basis</b><br><br>

  Der Skalierungsfaktor für den DRY-Algorithmus. Bestimmt, wie aggressiv die Strafe mit der Sequenzlänge skaliert.<br><br>

  💡 <i>Empfohlen: 1.75</i>'
dry_length_text: DRY erlaubte Länge
dry_length_tooltip: '<b>DRY erlaubte Länge</b><br><br>

  Die Anzahl an Tokens, die sich wiederholen dürfen, bevor die DRY-Strafe aktiviert wird.<br><br>

  💡 <i>Empfohlen: 2 (Verhindert, dass gängige Zwei-Wort-Phrasen wie "Ich bin" bestraft werden).</i>'
dry_mult_text: DRY-Multiplikator
dry_mult_tooltip: '<b>DRY (Don''t Repeat Yourself)</b><br><br>

  Anders als ältere Strafen, die sich auf einzelne Wörter richten, erkennt und bestraft DRY <b>ganze sich wiederholende Sequenzen und Satzstrukturen</b>.<br><br>

  Wenn deine Waifu jede Nachricht ständig mit <i>"Ich seufze und sehe dich an"</i> beginnt, erkennt DRY dieses Muster und zwingt sie, sich anders zu verhalten.<br><br>

  💡 <i><b>Multiplikator:</b> Stärke der Strafe (Versuche 0.8).</i>'
