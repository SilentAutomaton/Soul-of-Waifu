xtc_prob_text: XTC-Wahrscheinlichkeit
xtc_prob_tooltip: '<b>XTC (Exclude Top Choices)</b><br><br>

  Eine revolutionäre Funktion für Rollenspieler. Sie entfernt zwangsweise <b>die offensichtlichsten Klischeewörter</b> aus den Auswahlmöglichkeiten der KI.<br><br>

  Genug davon, dass die KI Sätze wie <i>„ein Schauer läuft mir über den Rücken"</i> oder <i>„raubtierhaftes Grinsen"</i> von sich gibt? XTC zwingt das Modell, einzigartige, literarische Alternativen zu finden, was die Sprache unglaublich lebensecht macht.<br><br>

  💡 <i><b>Wahrscheinlichkeit:</b> Die Chance, dass XTC ausgelöst wird (Versuche 0.3 - 0.5).</i>'
xtc_thresh_text: XTC-Schwellenwert
xtc_thresh_tooltip: '<b>XTC-Schwellenwert</b><br><br>

  Bestimmt, wie „beliebt" ein Wort sein muss, bevor XTC es entfernen darf.<br><br>

  💡 <i>Empfohlen: 0.1 (Nur Wörter mit mehr als 10 % Wahrscheinlichkeit können entfernt werden).</i>'
