lorebook_editor_button_tooltip: '<b>Lorebook-Editor</b><br><br>

  Ein Lorebook ist ein <b>Nachschlagewerk</b>, das einem Charakter hilft, sich an wichtige Ereignisse, Begriffe, Orte und Charaktere zu erinnern.<br><br>

  Wenn du etwas aus dem Lorebook erwähnst, verknüpft das Programm <b>automatisch die nötigen Informationen</b> mit der Anfrage, und der Charakter antwortet, als wüsste er es wirklich.<br><br>


  <b>Was du tun kannst:</b><br>

  • <b>Lorebooks erstellen und löschen</b>.<br>

  • <b>Einträge hinzufügen</b> — jeder Informationsblock: Ort, Charakter, Ereignis, Begriff.<br>

  • <b>Schlüsselwörter bearbeiten</b> — was der Eintrag „enthalten" soll.<br>

  • <b>Scan-Tiefe wählen</b> — wie viele letzte Nachrichten auf Treffer geprüft werden.<br><br>


  <b>Beispiel:</b><br>

  Du fügst einen Eintrag hinzu:<br>

  • <i>Text:</i> „Soul of Waifu ist ein Programm, mit dem du mit KI kommunizieren kannst."<br>

  • <i>Schlüsselwörter:</i> Soul of Waifu, KI<br>

  Wenn du sagst: <i>„Was ist Soul of Waifu?"</i>, erinnert sich der Charakter und antwortet mit Informationen zu diesem Eintrag.'
