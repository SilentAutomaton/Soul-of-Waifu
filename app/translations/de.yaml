context_size_text: Kontextgröße
context_size_tooltip: '<b>Kontextfenster</b><br><br>

  Dies ist die maximale Anzahl an Tokens, die das Modell auf einmal verarbeiten kann (sein Arbeitsgedächtnis). Es umfasst den Chatverlauf, Autorennotizen und Lorebook-Einträge.<br><br>

  Wähle den höchsten Wert für unbegrenzten Kontext (API) oder um automatisch das größte verfügbare Kontextfenster für dein lokales Sprachmodell zu erkennen.<br><br>

  Ein größeres Kontextfenster ermöglicht es dem Charakter, <b>sich mehr zu merken</b>, erhöht aber deutlich den VRAM-Verbrauch.<br><br>

  💡 <i>Verringere diesen Wert bei schwächeren PCs. Für Langzeitgedächtnis lasse das Modul ''Soul Memory'' aktiviert, anstatt die Kontextgröße zu maximieren.</i>'
