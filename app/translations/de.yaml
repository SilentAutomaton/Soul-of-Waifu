gpu_layers_text: GPU-Schichten
gpu_layers_tooltip: '<b>GPU-Schichten-Auslagerung</b><br><br>

  Mit dieser Einstellung kannst du <b>steuern, wie viel des LLM</b> direkt auf deiner GPU läuft, und so <b>Geschwindigkeit</b> und <b>Grafikspeicherverbrauch</b> ausbalancieren.<br><br>

  Je mehr Schichten in den VRAM geladen werden, desto schneller antwortet das Modell — aber desto höher ist der GPU-Speicherbedarf.<br>

  Du kannst manuell einstellen, wie viele Schichten ausgelagert werden, wodurch sich große Modelle auch auf Mittelklasse-GPUs betreiben lassen.<br><br>

  💡 <i>Besonders nützlich für große Modelle. Je stärker deine GPU, desto mehr Schichten kannst du zuweisen.</i>'
