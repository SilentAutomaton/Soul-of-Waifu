no_mmap_tooltip: '<b>Kein-MMAP-Modus (Direktes RAM-Laden)</b><br><br>

  Standardmäßig werden Modelle mittels Memory-Mapping (<b>mmap</b>) geladen, wodurch Teile des Modells während der Generierung bei Bedarf von deinem Speicherlaufwerk gelesen werden.<br><br>

  Durch Aktivieren dieser Option wird das System gezwungen, <b>das gesamte Modell im Voraus in den RAM zu laden</b>.<br>

  Dies erhöht die anfängliche Ladezeit und den RAM-Verbrauch leicht, verhindert jedoch Mikroruckler und Verzögerungen während der Textgenerierung.<br><br>

