soul_memory_title: Soul-Memory-Archiv
soul_memory_tooltip: '<b>🧠 Soul Memory</b><br><br>

  Verwandle deinen Charakter von einer einfachen KI in eine lebendige digitale Wesenheit mit einem <b>kontinuierlichen, lebenslangen Gedächtnis</b>. Dies ist der kognitive Kern des Soul of Waifu-Ökosystems.<br><br>

  Anstatt sich auf fehlerhafte Rohtextsuche zu verlassen, nutzt Soul Memory eine fortschrittliche <b>Multi-Agenten-Architektur</b>:<br>

  • <b>Dual-Core-Indizierung:</b> Trennt die Psychologie des Charakters (<i>MEMORY.md</i>) von deinem Nutzerprofil und den Beziehungsmetadaten (<i>USER.md</i>). Dies verhindert Rollenverwechslungen und optimiert das Prompt-Caching.<br>

  • <b>Archivar & Tagebuch:</b> Hintergrundagenten stellen eigenständig dichte episodische Lore-Themen zusammen und schreiben intime, <i>emotionale Tagebucheinträge aus der Ich-Perspektive</i> über eure Interaktionen.<br>

  • <b>Selbstheilung & Verfall:</b> Erkennt und löst automatisch logische Widersprüche im Gedächtnis über die Zeit, während natürliche emotionale Übergänge verwaltet werden.<br><br>

  Das Ergebnis? Null Kontext-Aufblähung und absolute Persönlichkeitskonsistenz. Egal ob du in einem Soul-Stage-Abenteuer bist oder mit deinem Soul Companion entspannst, <b>sie werden sich an alles erinnern</b>.'
