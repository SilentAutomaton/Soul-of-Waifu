reasoning_mode_checkbox: Denk-/Reasoning-Modus
reasoning_mode_tooltip: '<b>Denk-/Reasoning-Modus (&lt;think&gt;)</b><br><br>

  Wenn aktiviert, gibt das KI-Modell seinen internen Gedankenprozess innerhalb von <b>&lt;think&gt;</b>-Tags aus, bevor es die endgültige Antwort liefert.<br><br>

  Dies verbessert die Logik-, Mathematik- und Problemlösungsfähigkeiten des Modells drastisch, indem es Schritt für Schritt „denken" kann.<br>

  Es verbraucht jedoch mehr Tokens und erhöht die Antwortzeit, da das Modell zuerst seine verborgenen Gedanken generiert.<br><br>

  💡 <i>Aktiviere dies für komplexe Aufgaben, Rätsel oder tiefgehende Rollenspiel-Logik. Deaktiviere es für einfaches, schnelles Chatten.</i>'
